name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, pdo_sqlite, sqlite3, zip, exif
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The .env first: with no lock file, the install resolves the dependencies and runs
      # post-update-cmd, whose boost:update needs the app's local environment.
      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # Pages load the built front end (Vite's manifest).
      - name: Build the front end
        run: npm run build

      - name: Set up the app
        run: php artisan key:generate

      - name: Run the tests
        run: vendor/bin/pest
